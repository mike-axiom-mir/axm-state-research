name: Genesis admission contract

on:
  pull_request:
    paths:
      - 'experiments/genesis-admission-contract-v1/**'
      - '.github/workflows/genesis-admission-contract.yml'
  push:
    branches:
      - 'automation/state-architect-genesis-admission-v1'
    paths:
      - 'experiments/genesis-admission-contract-v1/**'
      - '.github/workflows/genesis-admission-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: experiments/genesis-admission-contract-v1
        run: python -m py_compile genesis_admission.py test_genesis_admission.py run_probe.py
      - name: Contract regressions
        working-directory: experiments/genesis-admission-contract-v1
        run: python -m unittest -v
      - name: Deterministic probe
        working-directory: experiments/genesis-admission-contract-v1
        run: python run_probe.py
