name: State research tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  experiments:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: State Floor
            directory: experiments/01-state-floor
          - name: Workfloor Sentinel
            directory: experiments/02-workfloor-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
        working-directory: ${{ matrix.directory }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
