name: MergeAgent State Research foundation integration

on:
  push:
    branches:
      - integration/state-foundation-current-main-20260912

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'MergeAgent integrate State Research foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/state-foundation-current-main-20260912
          fetch-depth: 0
      - name: Merge verified foundation donor without reverting later top-level truth
        run: |
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin ai/state-research-import-2026-09-02
          set +e
          git merge --no-ff --no-commit origin/ai/state-research-import-2026-09-02
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git checkout --ours README.md || true
            git add README.md
            git checkout --ours LICENSE || true
            git add LICENSE
            git checkout --ours AGENTS.md || true
            git add AGENTS.md
            git checkout --theirs .gitignore || true
            git add .gitignore
          fi
          if git ls-files --error-unmatch .github/workflows/tests.yml >/dev/null 2>&1; then
            git rm -f .github/workflows/tests.yml
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved merge paths:\n%s\n' "$unresolved"
            exit 1
          fi
          git diff --cached --check
          git commit -m 'MergeAgent integrate State Research foundation'
          git push origin HEAD:integration/state-foundation-current-main-20260912
