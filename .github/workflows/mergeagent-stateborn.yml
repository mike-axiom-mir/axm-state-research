name: MergeAgent Stateborn integration

on:
  push:
    branches:
      - integration/stateborn-current-main-20260912

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'MergeAgent flatten Stateborn chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/stateborn-current-main-20260912
          fetch-depth: 0
      - name: Flatten exact non-workflow Stateborn donor content
        run: |
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin ai/stateborn-checkpoint-process-verifier-2026-09-11 ai/stateborn-transport-feedback-2026-09-09

          CHECKPOINT=origin/ai/stateborn-checkpoint-process-verifier-2026-09-11
          EXPERIENCE=origin/ai/stateborn-transport-feedback-2026-09-09

          git checkout "$CHECKPOINT" -- experiments/07-stateborn-rpg-lab artifacts/stateborn
          for path in \
            lanes/2026-09-04-stateborn-coexistence-capsules.md \
            lanes/2026-09-10-stateborn-checkpoint-replay.md \
            lanes/2026-09-11-stateborn-checkpoint-process-verifier.md
          do
            git checkout "$CHECKPOINT" -- "$path"
          done

          for path in \
            experiments/07-stateborn-rpg-lab/dist/transport-experience.js \
            experiments/07-stateborn-rpg-lab/dist/transport.css \
            experiments/07-stateborn-rpg-lab/dist/transport.html \
            experiments/07-stateborn-rpg-lab/tests/transport-experience.test.mjs \
            experiments/07-stateborn-rpg-lab/tools/validate-static.mjs \
            lanes/2026-09-09-stateborn-transport-feedback.md
          do
            git checkout "$EXPERIENCE" -- "$path"
          done

          git status --short
          git commit -am 'MergeAgent flatten Stateborn chain' || {
            git add experiments/07-stateborn-rpg-lab artifacts/stateborn lanes
            git commit -m 'MergeAgent flatten Stateborn chain'
          }
          git push origin HEAD:integration/stateborn-current-main-20260912
