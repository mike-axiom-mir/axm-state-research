name: Publish 2026-09-13 public checkpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-checkpoint-release-20260913.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: public-checkpoint-2026-09-13
          STAGE: "Active experimental collection of bounded state/closure experiments, retained counterexamples, and research evidence."
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          repo_name="${GITHUB_REPOSITORY#*/}"
          printf '%s\n\n%s\n\n%s\n\n%s\n' "Public experimental checkpoint of ${repo_name}." "Current public stage: ${STAGE}" "This prerelease records the exact repository state at the tagged commit. Individual experiment evidence remains bounded software evidence and is not silently promoted to universal machine, hardware, biological, or CANON claims." "AXM-owned source is Apache-2.0; third-party material retains its own upstream terms. Read README.md and the experiment evidence files for details." > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${repo_name} — Public Checkpoint 2026-09-13" --notes-file release-notes.md --prerelease
