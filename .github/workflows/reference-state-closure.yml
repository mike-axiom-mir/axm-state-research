name: Reference-state closure experiment

on:
  pull_request:
    paths:
      - ".github/workflows/reference-state-closure.yml"
      - "experiments/reference-state-closure-v1/**"
      - "research/2026-09-09-routing-convergence-reference-state.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-state-closure.yml"
      - "experiments/reference-state-closure-v1/**"
      - "research/2026-09-09-routing-convergence-reference-state.md"

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run adversarial tests
        run: >-
          python -m unittest discover
          -s experiments/reference-state-closure-v1
          -p 'test_*.py'
          -v
      - name: Run machine-readable experiment gate
        run: python experiments/reference-state-closure-v1/experiment.py > reference-state-report.json
      - name: Build deterministic portable runner
        run: >-
          python experiments/reference-state-closure-v1/portable.py build
          --output reference-state-closure.pyz
          > portable-build-receipt.json
      - name: Verify portable runner against provider source
        run: >-
          python experiments/reference-state-closure-v1/portable.py verify
          reference-state-closure.pyz
          > portable-verify-receipt.json
      - name: Prove checkout-independent execution
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/reference-state-consumer"
          mkdir -p "$consumer"
          cp reference-state-closure.pyz "$consumer/reference-state-closure.pyz"
          (
            cd "$consumer"
            env -u PYTHONPATH python ./reference-state-closure.pyz verify > portable-self-verify.json
            env -u PYTHONPATH python ./reference-state-closure.pyz run > portable-report.json
          )
          cmp reference-state-report.json "$consumer/portable-report.json"
      - name: Publish inspectable evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-state-closure-python-${{ matrix.python-version }}
          path: |
            reference-state-report.json
            reference-state-closure.pyz
            portable-build-receipt.json
            portable-verify-receipt.json
            ${{ runner.temp }}/reference-state-consumer/portable-self-verify.json
            ${{ runner.temp }}/reference-state-consumer/portable-report.json
          if-no-files-found: error
