[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-workfloor-sentinel"
version = "0.1.0"
description = "Semantic invalidation and missed-wakeup experiment built on AXM State Floor"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["sentinel*"]
